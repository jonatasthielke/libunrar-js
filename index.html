<!DOCTYPE html>
<html manifest="page.appcache">
  <head>
    <title>Unrar</title>
    <meta name="viewport" content="width=device-width" />
  </head>
  <body>
    <h1>Unrar</h1>
    <div id="loadStatus">Loading....</div>
    <div id="drop-zone">Drop RAR file(s) here</div>
    <br />
    Or select from here:
    <input type="file" id="file" name="file" multiple /><br /><br />
    Password: <input id="password" /><br />
    <button id="unrarBtn">Unrar</button>

    <div id="output">
      <ul></ul>
    </div>

    <style>
      #drop-zone {
        border: 2px dashed rgb(187, 187, 187);
        border-radius: 5px 5px 5px 5px;
        padding: 50px;
        text-align: center;
        color: rgb(87, 87, 87);
      }
    </style>
    <!--polyfill for IE and older browser-->
    <script src="Promise.min.js"></script>
    <script src="download.js"></script>

    <script src="jszip.min.js"></script>
    <script src="rpc.js"></script>
    <script type="module" src="unrar-to-zip.js"></script>
    <script type="module">
      "use strict";

      import { unrarToZip } from './unrar-to-zip.js';

      const fileInput = document.getElementById('file');
      const passwordInput = document.getElementById('password');
      const unrarBtn = document.getElementById('unrarBtn');
      const dropZone = document.getElementById('drop-zone');
      const loadStatus = document.querySelector('#loadStatus');
      const outputList = document.querySelector('#output ul');

      let filesToProcess = [];

      const handleFiles = async (files) => {
        filesToProcess = Array.from(files);
        if (filesToProcess.length === 0) {
          loadStatus.innerHTML = 'Nenhum arquivo selecionado';
          return;
        }

        loadStatus.innerHTML = `Selecionado ${filesToProcess[0].name}`;
        // The actual processing will happen when the button is clicked or drop occurs
      };

      const startProcessing = async () => {
        if (filesToProcess.length === 0) {
          loadStatus.innerHTML = 'Nenhum arquivo para processar';
          return;
        }

        loadStatus.innerHTML = 'Processando...';
        outputList.innerHTML = ''; // clear previous output

        const password = passwordInput.value || null;

        // Define callback functions for status updates
        const options = {
            onLoad: () => {
                loadStatus.innerHTML = "Carregamento finalizado";
            },
            onProgress: (fileName, fileSize, progress) => {
                loadStatus.innerHTML = `${fileName} (${((100 * progress) / fileSize).toFixed(2)}%)`;
            },
            onError: (errMsg) => {
                loadStatus.innerHTML = `<strong>Erro: ${errMsg}</strong>`;
            }
        };

        try {
          // Call the library function with options
          const zipBlob = await unrarToZip(filesToProcess, password, options);

          // Handle the resulting zipBlob
          const downloadLink = document.createElement('a');
          downloadLink.href = URL.createObjectURL(zipBlob);
          downloadLink.download = 'output.zip';
          downloadLink.textContent = 'Download ZIP';
          const listItem = document.createElement('li');
          listItem.appendChild(downloadLink);
          outputList.appendChild(listItem);

          loadStatus.innerHTML = 'Concluído!';

        } catch (error) {
          loadStatus.innerHTML = `<strong>Erro: ${error.message}</strong>`;
          console.error(error);
        } finally {
            filesToProcess = []; // Clear files after processing attempt
        }
      };

      // Event Listeners
      fileInput.addEventListener('change', (evt) => {
        handleFiles(evt.target.files);
        loadStatus.innerHTML = "Clique no botão Unrar";
      });

      unrarBtn.addEventListener('click', startProcessing);

      dropZone.addEventListener('dragover', (event) => {
        event.stopPropagation();
        event.preventDefault();
        event.dataTransfer.dropEffect = 'copy';
      });

      dropZone.addEventListener('drop', (event) => {
        event.stopPropagation();
        event.preventDefault();
        handleFiles(event.dataTransfer.files);
        startProcessing(); // Start processing immediately on drop
      });

      // Initial status
      loadStatus.innerHTML = "Carregamento finalizado";

    </script>
  </body>
</html>
